# Local test setup for `subtun up --docker` and `--ssh`.
#
#   docker compose -f test/dev/compose.yaml up -d
#   build/subtun up --docker --create=false --name subtun-dev-target-1 --socks 127.0.0.1:1080
#   curl --socks5-hostname 127.0.0.1:1080 http://web:8080/
#   docker compose -f test/dev/compose.yaml down
#
# `target` runs the agent; `web` is another container on the same network,
# reachable by name or IP through the tunnel. Container IPs are not routable
# from macOS, which is the point.
#
# Python agent targets, with `--profile python` (up and down):
#   py36        oldest supported Python      --agent python
#   py314       newest Python                --agent python
#   hardened    read-only root, noexec /tmp and /dev/shm, non-root:
#               the binary agent can't run, auto falls back to Python
#   distroless  Python but no shell: auto goes straight to Python
#
# SSH targets, with `--profile ssh`, logging in with a throwaway key:
#   ssh-keygen -t ed25519 -N "" -f build/ssh-test/id_ed25519
#   sshd        published on 127.0.0.1:2222, user subtun; a jump host too
#   sshd-inner  on the compose network only: reach it through sshd
#   build/subtun up --ssh subtun@127.0.0.1:2222 -i build/ssh-test/id_ed25519 --socks 127.0.0.1:1080
#   build/subtun up --ssh subtun@sshd-inner:2222 -J subtun@127.0.0.1:2222 -i build/ssh-test/id_ed25519 --socks 127.0.0.1:1080
name: subtun-dev
services:
  target:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    init: true
  web:
    image: python:3.12-alpine
    command: ["python", "-u", "/app/web.py"]
    init: true
    volumes:
      - ./web.py:/app/web.py:ro

  py36:
    profiles: [python]
    image: python:3.6-alpine
    command: ["sleep", "infinity"]
    init: true
  py314:
    profiles: [python]
    image: python:3.14-alpine
    command: ["sleep", "infinity"]
    init: true
  hardened:
    profiles: [python]
    image: python:3.12-alpine
    command: ["sleep", "infinity"]
    init: true
    read_only: true
    user: "1000:1000"
    environment:
      HOME: /home/app
    tmpfs:
      - /tmp:rw,noexec,nosuid
  distroless:
    profiles: [python]
    image: gcr.io/distroless/python3-debian12
    command: ["-c", "import time; time.sleep(10**9)"]

  sshd:
    profiles: [ssh]
    image: lscr.io/linuxserver/openssh-server:latest
    environment: &sshd-env
      USER_NAME: subtun
      PUBLIC_KEY_FILE: /keys/id_ed25519.pub
      PASSWORD_ACCESS: "false"
    volumes:
      - ../../build/ssh-test:/keys:ro
      - ./sshd-forwarding.sh:/custom-cont-init.d/forwarding.sh:ro
    ports:
      - "127.0.0.1:2222:2222"
  sshd-inner:
    profiles: [ssh]
    image: lscr.io/linuxserver/openssh-server:latest
    environment: *sshd-env
    volumes:
      - ../../build/ssh-test:/keys:ro
