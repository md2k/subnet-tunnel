# Local test setup for `subtun k8s` (Docker Desktop, kind, ...).
#
#   kubectl apply -f test/k8s/dev.yaml
#   kubectl -n subtun-dev wait --for=condition=Ready pod --all
#   bin/subtun k8s -n subtun-dev target --socks 127.0.0.1:1080
#   curl --socks5-hostname 127.0.0.1:1080 http://web.subtun-dev.svc.cluster.local:8080/
#   kubectl delete namespace subtun-dev
#
# `target` is where the agent runs: a plain image with nothing but a shell.
# `web` is a separate service reached through it. GET /bytes/N returns N zero
# bytes, PUT/POST discards the body and returns its length, for throughput tests.
apiVersion: v1
kind: Namespace
metadata:
  name: subtun-dev
---
apiVersion: v1
kind: Pod
metadata:
  name: target
  namespace: subtun-dev
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: target
      image: alpine:3.20
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web
  namespace: subtun-dev
data:
  web.py: |
    import http.server

    CHUNK = bytes(1 << 20)

    class Handler(http.server.BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def reply(self, body):
            self.send_response(200)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if not self.path.startswith("/bytes/"):
                return self.reply(b"subtun-dev web ok\n")
            left = int(self.path[len("/bytes/"):])
            self.send_response(200)
            self.send_header("Content-Type", "application/octet-stream")
            self.send_header("Content-Length", str(left))
            self.end_headers()
            while left > 0:
                n = min(left, len(CHUNK))
                self.wfile.write(CHUNK[:n])
                left -= n

        def do_PUT(self):
            size = int(self.headers.get("Content-Length", "0"))
            left = size
            while left > 0:
                data = self.rfile.read(min(left, 1 << 20))
                if not data:
                    break
                left -= len(data)
            self.reply(f"{size - left}\n".encode())

        do_POST = do_PUT

        def log_message(self, *args):
            pass

    http.server.ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: subtun-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: python:3.12-alpine
          command: ["python", "-u", "/app/web.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 1
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap: {name: web}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: subtun-dev
spec:
  selector: {app: web}
  ports:
    - port: 8080
      targetPort: 8080
