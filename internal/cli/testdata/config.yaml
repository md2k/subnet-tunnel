# Test fixture. Only documentation ranges (RFC 5737), so results don't
# depend on the networks of the machine running the tests.
profiles:
  dev:
    target:
      k8s:
        context: kind-dev
        namespace: tools
        create: false
        name: debug
    routes:
      - 198.51.100.0/24
      - 203.0.113.0/24
      - 203.0.113.7
    exclude:
      - 203.0.113.128/25
    socks: 127.0.0.1:1080
  socks-only:
    target:
      docker:
        create: false
        name: app
    socks: 127.0.0.1:1081
  dns:
    target:
      docker:
        create: false
        name: app
    routes:
      - 198.51.100.0/24
    dns:
      domains: [svc.cluster.local]
      servers: [203.0.113.53]
      fallback: 203.0.113.54
    killSwitch: {mode: lockdown}
