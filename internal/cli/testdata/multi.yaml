# Test fixture for several profiles at once. Docker hosts are IP literals,
# so finding the endpoints needs no DNS; the machine's networks are stubbed
# (main_test.go).
defaults:
  dns:
    servers: [192.0.2.53]
profiles:
  work:
    target:
      docker:
        host: tcp://203.0.113.200:2376
        create: false
        name: work
    routes: [10.0.0.0/8, 203.0.113.0/24]
    dns:
      domains: [., corp.example]
    killSwitch:
      mode: "on"
  dev:
    target:
      docker:
        host: tcp://198.51.100.200:2376
        create: false
        name: dev
    routes: [10.50.0.0/16]
    socks: 127.0.0.1:1081
    dns:
      domains: [cluster.local]
  vault:
    target:
      docker:
        host: tcp://198.51.100.201:2376
        create: false
        name: vault
    routes: [10.60.0.0/16]
    killSwitch:
      mode: lockdown
  dup:
    target:
      docker:
        host: tcp://198.51.100.202:2376
        create: false
        name: dup
    routes: [10.50.0.0/16]
  all-names:
    target:
      docker:
        host: tcp://198.51.100.203:2376
        create: false
        name: all
    routes: [172.16.0.0/12]
    dns:
      domains: [.]
  other-tun:
    target:
      docker:
        host: tcp://198.51.100.204:2376
        create: false
        name: other
    routes: [172.20.0.0/16]
    tun:
      address: 198.18.250.1
  socks-dev:
    target:
      docker:
        host: tcp://198.51.100.205:2376
        create: false
        name: socks
    socks: 127.0.0.1:1081
  other-tun2:
    target:
      docker:
        host: tcp://198.51.100.206:2376
        create: false
        name: other2
    routes: [172.21.0.0/16]
    tun:
      address: 198.18.251.1
  full:
    target:
      docker:
        host: tcp://198.51.100.207:2376
        create: false
        name: full
    routes: [0.0.0.0/1, 128.0.0.0/1]
    killSwitch:
      mode: "on"
  calico:
    target:
      docker:
        host: tcp://198.51.100.208:2376
        create: false
        name: calico
    routes: [192.168.0.0/16]
  work-x:
    target:
      docker:
        host: tcp://198.51.100.209:2376
        create: false
        name: workx
    routes: [10.0.0.0/8]
    exclude: [10.50.1.0/24]
  named:
    target:
      k8s:
        kubeconfig: testdata/kubeconfig
        context: named
        create: false
        name: debug
    routes: [172.24.0.0/16]
    dns:
      domains: [.]
